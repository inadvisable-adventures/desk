<template id="desk-select-template">
  <style>
    :host {
      display: inline-block;
      font: 13px/1.4 sans-serif;
      color: var(--desk-select-color, #cbd5e1);
    }
    :host([disabled]) {
      opacity: 0.5;
      pointer-events: none;
    }
    .button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-sizing: border-box;
      width: 100%;
      min-width: 6em;
      padding: 3px 8px;
      font: inherit;
      color: inherit;
      text-align: left;
      background: var(--desk-select-bg, #1e293b);
      border: 1px solid var(--desk-select-border, #475569);
      border-radius: 4px;
      cursor: pointer;
    }
    .button:focus-visible {
      outline: 2px solid var(--desk-select-accent, #3daee9);
      outline-offset: 1px;
    }
    .label {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .arrow {
      flex: none;
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid currentColor;
    }
    /* position: fixed so the list is never clipped by an overflow:auto
       ancestor, and ordinary page content so it rides along with the
       canvas zoom/pan transform (never an OS-level popup). */
    .list {
      position: fixed;
      z-index: 2147483647;
      box-sizing: border-box;
      overflow-y: auto;
      padding: 2px 0;
      background: var(--desk-select-list-bg, #0f172a);
      border: 1px solid var(--desk-select-border, #475569);
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    .list[hidden] {
      display: none;
    }
    .option {
      padding: 3px 10px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .option[aria-selected="true"] {
      font-weight: 600;
    }
    .option[data-active] {
      background: var(--desk-select-accent, #3daee9);
      color: var(--desk-select-accent-text, #0b1220);
    }
    .option[aria-disabled="true"] {
      opacity: 0.45;
      cursor: default;
    }
  </style>
  <button type="button" class="button" part="button" role="combobox" aria-haspopup="listbox" aria-expanded="false">
    <span class="label"></span>
    <span class="arrow"></span>
  </button>
  <div class="list" role="listbox" hidden></div>
</template>
